<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecni Neural Core | Munitech</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #02030a;
            --primary-neon: #6366f1;
            --secondary-neon: #06b6d4;
            --text-pure: #f8fafc;
            --text-dim: #94a3b8;
            --glass-deep: rgba(10, 10, 15, 0.85);
            --border-neon: rgba(99, 102, 241, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-obsidian);
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-footer {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            opacity: 0.3;
            font-size: 0.65rem;
            letter-spacing: 2px;
            font-weight: 700;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        /* --- STAGE --- */
        .main-wrapper {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            box-sizing: border-box;
            z-index: 10;
        }

        .stage-side,
        .interface-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .robot-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-robot {
            width: 80%;
            max-width: 320px;
            filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.5));
            z-index: 5;
        }

        .floor-reflection {
            position: absolute;
            bottom: 12%;
            width: 350px;
            height: 50px;
            background: radial-gradient(ellipse at center, var(--primary-neon) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(20px);
            transform: scaleX(2);
        }

        /* --- INTERFACE --- */

        .neural-card {
            background: var(--glass-deep);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-neon);
            border-radius: 40px;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 40px 120px -30px rgba(0, 0, 0, 1);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }


        .logo-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #ffffff;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: baseline;
            gap: 4px;
            background: linear-gradient(to bottom, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            animation: title-entrance 1.5s ease-out;
        }

        .dots-container {
            display: flex;
            gap: 2px;
            -webkit-text-fill-color: #a5b4fc;
        }

        .dot {
            opacity: 0;
            animation: dot-pulse 1.5s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.4s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.8s;
        }

        @keyframes dot-pulse {

            0%,
            100% {
                opacity: 0.2;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-5px);
            }
        }

        @keyframes title-entrance {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .accent-line {
            width: 40px;
            height: 3px;
            background: var(--primary-neon);
            border-radius: 2px;
            margin-bottom: 2rem;
        }

        .bot-eyes {
            transform-origin: 100px 70px;
            animation: bot-blink 4s infinite;
        }

        @keyframes bot-blink {

            0%,
            94%,
            100% {
                transform: scaleY(1);
            }

            97% {
                transform: scaleY(0.1);
            }
        }

        .display-area {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #response {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #transcription {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--secondary-neon);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            opacity: 0.7;
        }

        .control-hub {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .input-bar {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .input-bar:focus-within {
            border-color: var(--primary-neon);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        #text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            padding: 0.5rem;
        }

        .mic-btn {
            width: 46px;
            height: 46px;
            background: var(--primary-neon);
            border: none;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .mic-btn:hover {
            transform: scale(1.05);
            background: #818cf8;
        }

        .mic-btn.listening {
            background: #f43f5e;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(244, 63, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
            }
        }

        #send-btn {
            background: transparent;
            border: none;
            color: var(--primary-neon);
            font-weight: 800;
            cursor: pointer;
            padding: 0 1rem;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .visualizer {
            display: none;
            gap: 5px;
            height: 25px;
            align-items: center;
            margin-top: 1.5rem;
        }

        .bar {
            width: 3px;
            height: 8px;
            background: var(--secondary-neon);
            border-radius: 2px;
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from {
                height: 6px;
            }

            to {
                height: 25px;
            }
        }

        /* --- RESPONSIVE DESIGN --- */

        /* TABLET VERSION (Cinematic & Balanced) */
        @media (min-width: 651px) {
            .main-wrapper {
                grid-template-columns: 0.8fr 1.22fr;
                /* Better ratio */
                gap: 2.5rem;
                padding: 4rem 3rem;
                align-items: center;
                /* Center cards vertically */
                height: 100vh;
            }

            .stage-side,
            .interface-side {
                height: 85vh;
                /* Don't take full height for a more "framed" look */
            }

            .neural-card {
                padding: 3rem;
                border-radius: 50px;
                height: 100%;
                justify-content: center;
                box-shadow: 0 50px 150px -40px rgba(0, 0, 0, 0.9);
            }

            .svg-robot {
                max-width: 320px;
                width: 90%;
                height: auto;
                filter: drop-shadow(0 40px 80px rgba(0, 0, 0, 0.6));
            }

            .logo-title {
                font-size: 3.2rem;
                margin-top: 0;
            }

            .accent-line {
                width: 60px;
                height: 4px;
                margin-bottom: 2.5rem;
            }

            #response {
                font-size: 1.6rem;
                line-height: 1.4;
            }

            #transcription {
                font-size: 0.8rem;
                margin-bottom: 1.5rem;
            }

            .input-bar {
                padding: 1rem;
                border-radius: 28px;
                gap: 1.2rem;
            }

            #text-input {
                font-size: 1.2rem;
            }

            .mic-btn {
                width: 55px;
                height: 55px;
                border-radius: 18px;
            }

            #send-btn {
                font-size: 1rem;
                min-width: 80px;
            }

            .main-footer {
                font-size: 0.7rem;
                opacity: 0.4;
                bottom: 25px;
                letter-spacing: 3px;
                left: 0;
                width: 100%;
                position: absolute;
            }
        }

        /* MOBILE VERSION (Stacked) */
        @media (max-width: 650px) {
            body {
                overflow: hidden;
                height: 100vh;
            }

            .main-wrapper {
                grid-template-columns: 1fr;
                grid-template-rows: 30vh 1fr;
                height: 100vh;
                gap: 0.8rem;
                padding: 0.8rem;
                padding-bottom: 2rem;
                overflow: hidden;
            }

            .neural-card {
                padding: 1rem;
                border-radius: 24px;
                gap: 0.5rem;
                height: 100%;
            }

            .stage-side,
            .interface-side {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            .robot-stage {
                height: 100%;
            }

            .svg-robot {
                max-width: 130px;
                width: auto;
                height: 80%;
                filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
            }

            .logo-title {
                font-size: 1.5rem;
                margin-top: 0;
            }

            .display-area {
                min-height: 80px;
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }

            #transcription {
                font-size: 0.6rem;
                margin-bottom: 0.5rem;
                letter-spacing: 1px;
            }

            #response {
                font-size: 1rem;
                line-height: 1.4;
            }

            .accent-line {
                margin-bottom: 0.5rem;
                height: 2px;
            }

            .input-bar {
                padding: 0.25rem;
                gap: 0.4rem;
            }

            #text-input {
                font-size: 0.9rem;
                padding: 0.4rem;
                min-width: 0;
            }

            .mic-btn {
                width: 38px;
                height: 38px;
                flex-shrink: 0;
            }

            #send-btn {
                padding: 0 0.5rem;
                font-size: 0.75rem;
                flex-shrink: 0;
                min-width: 60px;
            }

            .main-footer {
                position: absolute;
                bottom: 4px;
                left: 0;
                width: 100%;
                font-size: 0.45rem;
                opacity: 0.3;
                pointer-events: none;
            }
        }

        @media (max-height: 700px) and (max-width: 650px) {
            .main-wrapper {
                grid-template-rows: 25vh 1fr;
                gap: 0.6rem;
                padding: 0.6rem;
            }

            .svg-robot {
                max-width: 100px;
            }

            .neural-card {
                padding: 0.8rem;
            }

            .logo-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <!-- Stage: Robot Side -->
        <section class="stage-side">
            <div class="neural-card">
                <div class="robot-stage">
                    <div class="floor-reflection"></div>
                    <!-- ROBOT SVG PREMIUM: EXPRESIVO Y MODERNO -->
                    <svg class="svg-robot" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="robot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                            </linearGradient>
                            <filter id="eye-glow">
                                <feGaussianBlur stdDeviation="3" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>

                        <g>
                            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0"
                                dur="4s" repeatCount="indefinite" />

                            <!-- Arms -->
                            <rect x="52" y="115" width="12" height="40" rx="6" fill="#ffffff"
                                transform="rotate(10 52 115)" />
                            <rect x="136" y="115" width="12" height="40" rx="6" fill="#ffffff"
                                transform="rotate(-10 148 115)" />

                            <!-- Body -->
                            <rect x="65" y="105" width="70" height="85" rx="35" fill="url(#robot-grad)" />
                            <circle cx="100" cy="135" r="5" fill="#6366f1" filter="url(#eye-glow)" />

                            <!-- Head -->
                            <rect x="45" y="25" width="110" height="100" rx="50" fill="#ffffff" />
                            <!-- Visor Indigo Deep -->
                            <rect x="55" y="40" width="90" height="65" rx="32" fill="#1e1b4b" />

                            <!-- Ojos Cyan Pro (Parpadeo conjunto corregido) -->
                            <g class="bot-eyes">
                                <!-- Eye Left -->
                                <circle cx="80" cy="70" r="10" fill="#22d3ee" fill-opacity="0.2" />
                                <circle cx="80" cy="70" r="5" fill="#22d3ee" filter="url(#eye-glow)" />

                                <!-- Eye Right -->
                                <circle cx="120" cy="70" r="10" fill="#22d3ee" fill-opacity="0.2" />
                                <circle cx="120" cy="70" r="5" fill="#22d3ee" filter="url(#eye-glow)" />
                            </g>

                            <!-- Digital Smile -->
                            <path d="M90 88 Q100 95 110 88" stroke="#22d3ee" stroke-width="2.5" fill="none"
                                stroke-linecap="round" opacity="0.8" />

                            <!-- Antennas -->
                            <line x1="100" y1="25" x2="100" y2="8" stroke="#6366f1" stroke-width="4"
                                stroke-linecap="round" />
                            <circle cx="100" cy="4" r="4" fill="#6366f1" filter="url(#eye-glow)">
                                <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
                            </circle>
                        </g>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Interface Side -->
        <section class="interface-side">
            <div class="neural-card">
                <header>
                    <h1 class="logo-title">
                        Tecni
                        <div class="dots-container">
                            <span class="dot">.</span>
                            <span class="dot">.</span>
                            <span class="dot">.</span>
                        </div>
                    </h1>
                    <div class="accent-line"></div>
                </header>

                <div class="display-area">
                    <div id="transcription">ESTADO: ONLINE_</div>
                    <div id="response" class="typing-effect">¡Hola! Soy Tecni. Estoy listo para asistirte en todo lo que
                        necesites hoy.</div>

                    <div class="visualizer" id="visualizer">
                        <div class="bar" style="animation-delay: 0.1s"></div>
                        <div class="bar" style="animation-delay: 0.3s"></div>
                        <div class="bar" style="animation-delay: 0.2s"></div>
                        <div class="bar" style="animation-delay: 0.4s"></div>
                    </div>
                </div>

                <div class="control-hub">
                    <div class="input-bar">
                        <button class="mic-btn" id="mic-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                <line x1="8" y1="23" x2="16" y2="23"></line>
                            </svg>
                        </button>
                        <input type="text" id="text-input" placeholder="Escribí o hablá acá..." autocomplete="off">
                        <button id="send-btn">ENVIAR_</button>
                    </div>
                </div>
            </div>

        </section>
    </div>

    <footer class="main-footer">
        MUNICIPALIDAD DE SANTA FE • INTERFAZ COGNITIVA v4.2
    </footer>

    <script>
        // Tecni Secure Core v2.0 - Clave centralizada en el servidor
        const micBtn = document.getElementById('mic-btn');
        const transcriptionDiv = document.getElementById('transcription');
        const responseDiv = document.getElementById('response');
        const visualizer = document.getElementById('visualizer');
        const textIn = document.getElementById('text-input');

        let isListening = false;
        let isSpeaking = false;
        let chatHistory = [];
        let recognition;

        async function askAI(prompt) {
            const messages = [
                {
                    role: "system",
                    content: "Sos Tecni, de Munitech Santa Fe Capital. REGLAS: 1. NO uses insultos ni malas palabras bajo ningún concepto. 2. NO digas 'che' ni 'boludo', hablá de forma educada pero cercana. 3. Enfocate en Santa Fe Capital: si te preguntan por 'el faro', asumí siempre que hablan del Faro de la Costanera de Santa Fe. 4. Si el usuario insulta, respondé educadamente que no podés hablar en esos términos. Breve (2 oraciones), voseo santafesino correcto."
                },
                ...chatHistory,
                { role: "user", content: prompt }
            ];
            try {
                const res = await fetch("/api/chat", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages })
                });
                const data = await res.json();
                if (data.choices) {
                    const text = data.choices[0].message.content.trim().replace(/\*\*/g, '').replace(/[*#]/g, '');
                    chatHistory.push({ role: "user", content: prompt }, { role: "assistant", content: text });
                    if (chatHistory.length > 8) chatHistory.splice(0, 2);
                    return text;
                }
            } catch (e) { console.error(e); }
            return "¡Qué bueno! Me encantó. ¿Qué más?";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                transcriptionDiv.innerText = "Escuchando_";
            };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                transcriptionDiv.innerText = `Input: "${text}"`;
                processInput(text);
            };
            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
            };
        }

        async function processInput(input) {
            responseDiv.innerText = "...";
            const res = await askAI(input);
            speak(res);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'es-AR';
            ut.onstart = () => {
                isSpeaking = true;
                visualizer.style.display = 'flex';
                responseDiv.innerText = text;
            };
            ut.onend = () => {
                isSpeaking = false;
                visualizer.style.display = 'none';
            };
            window.speechSynthesis.speak(ut);
        }

        document.getElementById('send-btn').onclick = () => {
            if (textIn.value) { processInput(textIn.value); textIn.value = ''; }
        };
        textIn.onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('send-btn').click(); };
        micBtn.onclick = () => {
            if (isSpeaking) window.speechSynthesis.cancel();
            if (isListening) recognition.stop(); else recognition.start();
        };

        window.onload = () => {
            setTimeout(() => speak("¡Hola! Soy Tecni. ¿Cómo estás hoy?"), 1000);
        };
    </script>
</body>

</html>
